<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">Fact Fuse</title><desc id="desc">Change the words. Keep what matters. A price, a limit, a promise.</desc><rect width="1440" height="520" fill="#f3f1e8"/><path d="M0 460H1440M70 0V520M1370 0V520" stroke="#dedfd4"/><g font-family="Arial,sans-serif"><text x="110" y="95" fill="#707963" font-size="14" letter-spacing="4">UFODIA / INDEPENDENT TOOLS</text><text x="106" y="218" fill="#263122" font-size="86" font-weight="700" letter-spacing="-4">fact fuse</text><text x="110" y="281" fill="#d94427" font-size="31">Change the words. Keep what matters.</text><text x="110" y="342" fill="#69745b" font-size="19">A local second look at the facts inside AI rewrites.</text><rect x="110" y="383" width="130" height="34" rx="3" fill="#dce4d1"/><text x="128" y="405" fill="#35472a" font-size="12" letter-spacing="2">OPEN SOURCE</text></g><g transform="translate(850 110) rotate(-3 200 150)"><rect width="440" height="283" rx="5" fill="#fffdf4" stroke="#cfd5c3"/><g font-family="Arial,sans-serif"><text x="30" y="43" fill="#7a846f" font-size="12" letter-spacing="3">THE INVISIBLE EDIT</text><text x="30" y="110" fill="#8a8f80" font-size="31">We may deliver.</text><path d="M85 101H153" stroke="#a6ab9c" stroke-width="2"/><rect x="25" y="135" width="386" height="64" fill="#f8dacc"/><text x="37" y="177" fill="#b83b22" font-size="31">We will deliver.</text><text x="30" y="244" fill="#6e775f" font-size="14">A possibility just became a promise.</text></g></g><g font-family="Arial,sans-serif" fill="#7a846f" font-size="12"><text x="110" y="493">NUMBERS / CONDITIONS / COMMITMENTS</text><text x="1140" y="493">LOCAL BY DESIGN</text></g></svg>
